server {
    listen 80;
    server_name cranamp.dmitrysamoylenko.in;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /review/playback-check.wav {
        default_type audio/wav;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
