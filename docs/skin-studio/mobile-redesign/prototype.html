layer-row{display:flex;align-items:center;gap:10px;padding:12px 8px;background:#162738;border:1px solid transparent;border-radius:12px;margin-bottom:10px}.layer-row.selected{border-color:#36d8e9}.layer-row .thumb{width:46px;flex-shrink:0}.layer-row .thumb .piece{aspect-ratio:1;background:#1e3446}.layer-row .name{flex:1;text-align:left;background:transparent;padding:4px;min-height:48px;min-width:0}.layer-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inspector .layer-row{gap:4px;padding:8px 0}.inspector .layer-row .thumb{width:28px}.layer-row .icon{width:48px;min-height:48px}.action-row{display:flex;align-items:center;text-align:left;width:100%;gap:14px;padding:14px 0;min-height:74px;border-bottom:1px solid #2b4054;background:transparent}.action-row>svg:first-child{width:28px;height:28px;color:#d9eaf5}.action-row>span{flex:1}.action-row small{display:block;margin-top:4px;line-height:1.4}.action-row.danger{color:#ffabb1}.colour-area{display:flex;gap:12px;height:260px}.saturation{flex:1;border-radius:10px;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,#149cf2);position:relative}.saturation:after{content:"";position:absolute;left:62%;top:32%;border:2px solid white;width:20px;height:20px;border-radius:50%}.hue{width:32px;border-radius:10px;background:linear-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.swatches button{aspect-ratio:1;min-height:48px;border-radius:8px;border:1px solid #8ba4b8}.colour-value{display:flex;align-items:center;gap:14px}.preview-art{margin:auto;width:min(82%,320px)}.preview-page{display:flex;flex-direction:column;gap:20px;justify-content:center;align-items:center;flex:1;min-height:0;overflow:auto;padding:20px}.preview-page .preview-art{max-height:70%;width:auto;max-width:100%;image-rendering:pixelated;object-fit:contain}.play-circle{width:58px;height:58px;border:1px solid #a8bccb;border-radius:50%;display:grid;place-items:c <body>
<div class="review-bar"><strong>Skin Studio / design prototype</strong><label>Viewport <select id="viewport"><option value="small">Small phone · 360</option><option value="large">Large phone · 430</option><option value="compact">Compact tablet · 768</option><option value="tablet">Wide tablet · 1100</option><option value="desktop">Desktop · 1440</option><option value="landscape">Landscape phone · 740 × 360</option></select></label><span>Demo navigation only. No skin or audio files are changed.</span><a href="brief.md">Design specification</a></div>
<div class="review-host"><main id="app" class="frame" data-layout="small" aria-label="Skin Studio design prototype"></main></div>
<input id="file" type="file" accept=".wsz,.zip,.cstudio" hidden>
<script>
const paths={back:'m15 18-6-6 6-6',plus:'M12 5v14M5 12h14',close:'m6 6 12 12M6 18 18 6',chevron:'m9 5 7 7-7 7',undo:'M8 6 3 11l5 5M3 11h11a6 6 0 0 1 6 6',redo:'m16 6 5 5-5 5M21 11H10a6 6 0 0 0-6 6',brush:'m15 3 6 6-10 10-7 1 1-7zM13 5l6 6',eraser:'m14 3 7 7-10 10H6l-4-4zM8 10l7 7M12 20h9',select:'M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5',layers:'m12 3 10 6-10 6L2 9zM2 14l10 6 10-6M2 18l10 5 10-5',play:'m9 5 11 7-11 7z',pause:'M8 5v14M16 5v14',folder:'M3 6h7l2 3h9v11H3z',music:'M10 18V5l10-2v13M10 18a3 3 0 1 1-3-3h3M20 16a3 3 0 1 1-3-3h3',share:'M12 15V2m-4 4 4-4 4 4M5 11H3v10h18V11h-2',save:'M4 3h13l4 4v14H3V3zM7 3v6h9V3M7 21v-8h10v8',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',lock:'M6 10h12v11H6zM8 10V6a4 4 0 0 1 8 0v4',more:'M5 12h.01M12 12h.01M19 12h.01',hand:'M6 12V7a2 2 0 0 1 4 0v5-9a2 2 0 0 1 4 0v9-7a2 2 0 0 1 4 0v9-4a2 2 0 0 1 4 0v7l-5 5H9L2 13a2 2 0 0 1 3-2l3 3',drop:'m16 3 5 5M14 5l5 5-10 10-5 1 1-5z',check:'m4 12 5 5L20 6',minus:'M5 12h14',parts:'M3 3h8v7H3zM14 3h7v7h-7zM3 14h8v7H3zM14 14h7v7h-7z',grid:'M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18',line:'M4 20 20 4',rect:'M3 5h18v14H3z',circle:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18',text:'M3 5h18M12 5v15M8 20h8',import:'M12 3v12m-4-4 4 4 4-4M3 16v5h18v-5',trash:'M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7',info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 11v6M12 7h.01'};
const icon=(name)=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[name]||paths.more}"/></svg>`;
const button=(name,label,action,active=false)=>`<button class="icon ${active?'active':''}" aria-label="${label}" title="${label}" data-action="${action}">${icon(name)}</button>`;
const safe=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const projectNames=['Silverplay','Moon Garden','Midnight Snack'];
const src=name=>`../../../assets/skins/Catamp ${encodeURIComponent(name)}.png`;
const parts=[{id:'player',label:'Player',y:0,h:232},{id:'eq',label:'Equalizer',y:232,h:232},{id:'playlist',label:'Playlist',y:464,h:290},{id:'cursors',label:'Cursors',y:0,h:160},{id:'shade',label:'Windowshade',y:0,h:28},{id:'joined',label:'Joined canvas',y:0,h:754}];
const state={screen:'projects',sheet:null,project:'Silverplay',part:'player',tool:'brush',size:3,opacity:100,colour:'#87abc9',grid:true,zoom:1,layer:1,playing:false,pressed:false,view:'small',layers:['Highlights','Cat','Controls','Background'],hidden:new Set(),locked:new Set([3]),undo:0};
let previousFocus=null;
const app=document.querySelector('#app');
const layout=()=>app.dataset.layout;
const isTablet=()=>layout()==='tablet';
const selectedPart=()=>parts.find(p=>p.id===state.part);
function piece(part='player',project=state.project){const p=parts.find(p=>p.id===part);if(part==='cursors')return `<div class="piece cursor-piece">${icon('select')}${icon('hand')}${icon('brush')}</div>`;return `<div class="piece ${part==='joined'?'all-piece':''}" style="aspect-ratio:550/${p.h}"><img alt="${safe(project)} ${p.label}" src="${src(project)}" style="transform:translateY(-${p.y/754*100}%)"></div>`;}
function header(title,subtitle='',back='projects',extra=''){return `<header class="topbar">${back?button('back','Back',back):''}<div class="title"><h2>${title}</h2>${subtitle?`<small>${subtitle}</small>`:''}</div>${extra}</header>`;}
function partCards(){return parts.map(p=>`<button class="part" aria-current="${p.id===state.part}" data-action="part:${p.id}">${piece(p.id)}<span class="caption">${p.label}${p.id===state.part?icon('check'):''}</span></button>`).join('');}
function layerRows(){return state.layers.map((name,i)=>`<div class="layer-row ${state.layer===i?'selected':''}"><div class="thumb">${piece(i===2?'eq':'player')}</div><button class="name" data-action="layer:${i}">${safe(name)}</button>${button('eye',`${state.hidden.has(i)?'Show':'Hide'} ${name}`,`eye:${i}`,!state.hidden.has(i))}${button(state.locked.has(i)?'lock':'more',`Actions for ${name}`,`layer-menu:${i}`)}</div>`).join('');}
function toolSettings(){return `<div class="stroke-sample" style="--ink:${state.colour}"><svg viewBox="0 0 160 45"><path d="M4 32h18V20h18V10h30v12h30v11h50"/></svg></div><div><label class="setting-label" for="size">Size <output id="size-value">${state.size} px</output></label><input id="size" type="range" min="1" max="16" value="${state.size}" data-setting="size"></div><div><label class="setting-label" for="opacity">Opacity <output id="opacity-value">${state.opacity}%</output></label><input id="opacity" type="range" min="0" max="100" value="${state.opacity}" data-setting="opacity"></div><div class="setting-label"><span>Pixel grid</span><button class="switch" role="switch" aria-label="Pixel grid" aria-checked="${state.grid}" data-action="grid"></button></div>`;}
function projects(){return header('Skin Studio','',null,button('plus','New or import','import'))+`<section class="page"><button class="project-card featured" data-action="project:Silverplay">${piece('player','Silverplay')}<h3>Silverplay</h3><small>Working copy · on this device</small></button><div class="project-grid">${projectNames.slice(1).map(name=>`<button class="project-card" data-action="project:${name}">${piece('player',name)}<h3>${name}</h3><small>Bundled skin</small></button>`).join('')}</div><p class="empty-note">Open a skin to make your own copy. The original stays unchanged.</p></section><button class="fab" aria-label="New or import" data-action="import">${icon('plus')}</button><nav class="bottom-nav" aria-label="Studio navigation"><button class="selected" data-action="projects">${icon('folder')}<small>Projects</small></button><button data-action="preview">${icon('music')}<small>Player</small></button></nav>`;}
function canvas(){const tablet=isTablet();const wide=tablet&&app.clientWidth>=900;return header(safe(state.project),selectedPart().label,'projects',button('undo','Undo','undo')+button('redo','Redo','redo')+button('more','Project actions','actions'))+`<section class="workspace">${tablet?`<nav class="rail" aria-label="Skin parts">${partCards()}</nav>`:''}<div class="painting" aria-label="Canvas interaction demonstration"><button class="scope-chip" data-action="parts" aria-label="Choose a skin part">${icon('parts')}<span>${selectedPart().label}</span></button><div class="art" style="transform:scale(${state.zoom});">${piece(state.part)}</div><div class="ink-cursor"></div><div class="zoom-controls">${button('minus','Zoom out','zoom-out')}<output>${Math.round(state.zoom*100)}%</output>${button('plus','Zoom in','zoom-in')}</div></div>${wide?`<aside class="inspector"><h3>${({brush:'Pencil',eraser:'Eraser',line:'Line',rect:'Rectangle',circle:'Ellipse',select:'Selection',text:'Text',hand:'Hand',drop:'Colour sample'})[state.tool]} ${button(state.tool,'Choose tool','tools')}</h3><nav class=inspector-tools aria-label="Canvas actions"><button class=icon data-action=colour aria-label="Brush colour" title="Brush colour"><span class=swatch style="--ink:${state.colour}"></span></button>${button('select','Selection settings','selection')}${button('play','Preview skin','preview')}${button('share','Save and share','save')}</nav>${toolSettings()}<h3>Layers ${button('plus','Add layer','add-layer')}</h3>${layerRows()}</aside>`:''}</section>${tablet&&!wide?`<nav class="paint-tools" style="display:flex">${paintTools()}</nav>`:!tablet?`<nav class="paint-tools" aria-label="Painting tools">${paintTools()}</nav>`:''}`;}
function paintTools(){return button(state.tool,'Choose painting tool','tools',true)+`<button class="icon" data-action="colour" aria-label="Brush colour" title="Brush colour"><span class="swatch" style="--ink:${state.colour}"></span></button>`+button('select','Selection settings','selection')+button('layers','Painting layers','layers')+button('play','Preview skin','preview');}
function preview(){return header('Preview',state.project,'canvas',button('share','Save and share','save'))+`<section class="preview-page"><img class="preview-art" src="${src(state.project)}" alt="Whole ${safe(state.project)} skin"><button class="play-circle" aria-label="${state.playing?'Pause preview':'Play preview'}" data-action="play">${icon(state.playing?'pause':'play')}</button><div class="state-strip" aria-label="Sprite state"><button class="${state.pressed?'':'active'}" data-action="normal">Normal</button><button class="${state.pressed?'active':''}" data-action="pressed">Pressed</button></div><small>Player interaction is simulated in this prototype.</small></section>`;}
function save(){return header('Save and share','','canvas')+`<section class="page"><div class="save-cover">${piece()}<h2>${safe(state.project)}</h2></div><label>Name<input type="text" aria-label="Project name" value="${safe(state.project)}"></label>${actionRow('save','Save project','Keep layers and editing history','save-project')}${actionRow('share','Export skin','Use in a classic Winamp player','export')}${actionRow('play','Use in Cranamp','Apply this skin to your player','apply')}<p class="status-line">${icon('info')}Design prototype. Saving and export are not connected.</p></section>`;}
function actionRow(i,title,sub,act){return `<button class="action-row" data-action="${act}">${icon(i)}<span>${title}<small>${sub}</small></span>${icon('chevron')}</button>`;}
function sheetContent(){switch(state.sheet){case 'import':return ['New project',actionRow('import','Open a file','WSZ, ZIP or Studio project','pick-file')+actionRow('plus','Start blank','Create a new skin project','blank')+actionRow('folder','Use a bundled skin','Choose a starting point','projects')];case 'parts':return ['Choose a part',`<div class="parts ${layout()==='small'?'':'grid'}">${partCards()}</div>`];case 'tools':return ['Painting tools',`<div class="tool-grid">${[['brush','Pencil'],['eraser','Eraser'],['line','Line'],['rect','Rectangle'],['circle','Ellipse'],['select','Selection'],['text','Text'],['hand','Hand']].map(([i,name])=>`<button class="tool-choice ${state.tool===i?'active':''}" aria-label="${name}" data-action="tool:${i}">${icon(i)}<span>${name}</span></button>`).join('')}</div>${actionRow('brush','Tool settings','Change the selected tool','brush-settings')}`];case 'brush-settings':return [state.tool==='brush'?'Pencil':'Tool settings',toolSettings()];case 'selection':return ['Selection',`<p class="muted">Select an area on the canvas. Selection actions appear after an area is selected.</p>${actionRow('select','Rectangle selection','Drag to select pixels','tool:select')}${actionRow('hand','Move canvas','Pan without painting','tool:hand')}`];case 'layers':return ['Layers',`${layerRows()}${actionRow('plus','Add layer','A separate painting layer','add-layer')}`];case 'layer-actions':return [safe(state.layers[state.layer]),actionRow('lock',state.locked.has(state.layer)?'Unlock layer':'Lock layer','Control whether this layer can be painted','lock-layer')+actionRow('plus','Duplicate layer','Create an editable copy','duplicate-layer')+actionRow('trash','Delete layer','Confirm before removing','delete-layer')];case 'colour':return ['Colour',`<div class="colour-area"><div class="saturation" role="img" aria-label="Saturation and value picker preview"></div><div class="hue" role="img" aria-label="Hue strip preview"></div></div><div class="colour-value"><span class="swatch" style="--ink:${state.colour}"></span><input type="text" aria-label="Hex colour" value="${state.colour}" data-setting="colour">${button('drop','Sample colour from artwork','eyedropper')}</div><h3>From this skin</h3><div class="swatches">${['#17435d','#87abc9','#c2dfe8','#edf7fa','#0c1620','#60798c','#33cadb','#f2ca83'].map(c=>`<button style="background:${c}" aria-label="Use ${c}" data-action="colour:${c}"></button>`).join('')}</div>`];case 'actions':return ['Project',actionRow('parts','Choose a part','Change the visible artwork','parts')+actionRow('share','Save and share','Project, skin export or player','save')+actionRow('info','Advanced skin settings','Sprite destinations and state coverage','advanced')];case 'advanced':return ['Advanced skin settings',`<p class="muted">These settings affect how paint reaches classic skin sprites. Changing the visible part does not change paint destinations.</p>${actionRow('layers','Paint destinations','Automatic overlapping parts','destinations')}${actionRow('grid','Sprite states','Normal, pressed and inactive','states')}`];default:return ['Details',''];}}
function sheet(){if(!state.sheet)return '';const [title,body]=sheetContent();const full=(layout()==='small'&&['parts','layers','colour','advanced'].includes(state.sheet))||app.dataset.short==='true';return `<div class="sheet-shade" data-action="dismiss-shade"><section class="sheet ${full?'full':''}" role="dialog" aria-modal="true" aria-label="${title}">${full?'':'<div class="handle"></div>'}<div class="sheet-head"><h2>${title}</h2>${button('close','Close panel','close')}</div><div class="sheet-content">${body}</div></section></div>`;}
function render(){app.innerHTML='<div class=screen'+(state.sheet?' inert':'')+'>'+({projects,canvas,preview,save}[state.screen]||projects)()+'</div>'+sheet();if(state.sheet){app.querySelector('.sheet .icon')?.focus({preventScroll:true});}bindCanvas();}
function notify(text){app.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=text;app.append(el);setTimeout(()=>el.remove(),4500);}
function openSheet(name){previousFocus=document.activeElement?.getAttribute('data-action');state.sheet=name;render();}
function action(command){const [a,...rest]=command.split(':');const value=rest.join(':');if(['projects','canvas','preview','save'].includes(a)){state.screen=a;state.sheet=null;}else if(['parts','tools','layers','colour','selection','actions','advanced','import','brush-settings'].includes(a)&&!value){openSheet(a);return;}else if(a==='close'){state.sheet=null;}else if(a==='project'){state.project=value;state.screen='canvas';state.zoom=1;state.sheet=isTablet()?null:'parts';}else if(a==='part'){state.part=value;state.screen='canvas';state.sheet=null;state.zoom=1;}else if(a==='tool'){state.tool=value;state.sheet=null;}else if(a==='colour'){state.colour=value;state.sheet=null;}else if(a==='zoom-in'){state.zoom=Math.min(8,state.zoom+.5);}else if(a==='zoom-out'){state.zoom=Math.max(.5,state.zoom-.5);}else if(a==='grid'){state.grid=!state.grid;}else if(a==='layer'){state.layer=Number(value);}else if(a==='eye'){const n=Number(value);state.hidden.has(n)?state.hidden.delete(n):state.hidden.add(n);}else if(a==='layer-menu'){state.layer=Number(value);state.sheet='layer-actions';}else if(a==='lock-layer'){state.locked.has(state.layer)?state.locked.delete(state.layer):state.locked.add(state.layer);state.sheet='layers';}else if(a==='duplicate-layer'){state.layers.splice(state.layer,0,state.layers[state.layer]+' copy');state.sheet='layers';}else if(a==='delete-layer'){notify('The app will ask for confirmation before deleting a layer.');return;}else if(a==='add-layer'){state.layers.unshift('New layer');state.layer=0;state.sheet='layers';}else if(a==='blank'){state.screen='canvas';state.sheet=null;render();notify('Blank creation is a prototype handoff. The example artwork remains.');return;}else if(a==='pick-file'){document.querySelector('#file').click();return;}else if(a==='play'){state.playing=!state.playing;}else if(a==='normal'||a==='pressed'){state.pressed=a==='pressed';}else if(a==='dismiss-shade'){state.sheet=null;}else if(a==='eyedropper'){state.sheet=null;state.tool='drop';}else if(['save-project','export','apply','destinations','states','undo','redo'].includes(a)){notify(({ 'save-project':'The app will open a project save destination.',export:'The app will validate the skin and open the WSZ export destination.',apply:'The app will apply the skin and return to playback.',destinations:'Advanced destination selection belongs here.',states:'Visual sprite-state selection belongs here.',undo:'Undo is connected to the shared document history in the app.',redo:'Redo is connected to the shared document history in the app.'})[a]);return;}render();if(a==='close'&&previousFocus)app.querySelector(`[data-action="${previousFocus}"]`)?.focus({preventScroll:true});}
app.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;if(target.dataset.action==='dismiss-shade'&&e.target!==target)return;action(target.dataset.action);});
app.addEventListener('input',e=>{const setting=e.target.dataset.setting;if(!setting)return;if(setting==='colour'){if(/^#[0-9a-f]{6}$/i.test(e.target.value))state.colour=e.target.value;return;}state[setting]=Number(e.target.value);const output=app.querySelector('#'+setting+'-value');if(output)output.textContent=e.target.value+(setting==='size'?' px':'%');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){e.preventDefault();action('close');}if(e.key==='Tab'&&state.sheet){const items=[...app.querySelectorAll('.sheet button,.sheet input')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.querySelector('#file').addEventListener('change',e=>{if(e.target.files[0])notify('Selected '+e.target.files[0].name+'. Archive loading is not connected in this prototype.');});
function bindCanvas(){const canvas=app.querySelector('.painting');if(!canvas)return;const cursor=canvas.querySelector('.ink-cursor');canvas.addEventListener('pointermove',e=>{if(e.target.closest('button'))return;const r=canvas.getBoundingClientRect();cursor.style.display='block';cursor.style.left=(e.clientX-r.left-12)+'px';cursor.style.top=(e.clientY-r.top-12)+'px';});canvas.addEventListener('pointerleave',()=>cursor.style.display='none');canvas.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;notify('Canvas gesture preview. Painting is not connected to a skin document.');});}
function resize(){const sizes={small:[360,740],large:[430,860],compact:[768,940],tablet:[1100,780],desktop:[1440,900],landscape:[740,360]};const size=sizes[state.view];app.style.width=size[0]+'px';app.style.height=size[1]+'px';const w=app.clientWidth,h=app.clientHeight;app.dataset.layout=w<380?'small':w<600?'large':'tablet';app.dataset.short=h<500;app.dataset.desktop=w>=1280;app.dataset.compact=w>=600&&w<900;render();}
document.querySelector('#viewport').addEventListener('change',e=>{state.view=e.target.value;resize();});window.addEventListener('resize',resize);resize();
</script>
</body></html>
