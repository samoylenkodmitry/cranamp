</style></head><body><h1>Skin Studio native review, October 25</h1>
<p>Actual desktop GPU captures at the requested logical window sizes. Select an image for its full size. These captures do not verify Android S Pen hover or touch gestures.</p><main>
<figure><a href="native-240x568-v6.jpg"><img src="native-240x568-v6.jpg" alt="240 x 568" loading="lazy"></a><figcaption>240 x 568<span>Minimum window: stacked field labels and two quick swatches.</span></figcaption></figure>
<figure><a href="native-320x640-v6.jpg"><img src="native-320x640-v6.jpg" alt="320 x 640" loading="lazy"></a><figcaption>320 x 640<span>Small phone: current properties stay visible above the tools.</span></figcaption></figure>
<figure><a href="native-430x820-v6.jpg"><img src="native-430x820-v6.jpg" alt="430 x 820" loading="lazy"></a><figcaption>430 x 820<span>Phone: saved colours and exact colour editing beside zoom.</span></figcaption></figure>
<figure><a href="native-488x538-v6.jpg"><img src="native-488x538-v6.jpg" alt="488 x 538" loading="lazy"></a><figcaption>488 x 538<span>Reference window: compact properties give the canvas 44 more pixels of height.</span></figcaption></figure>
<figure><a href="native-600x360-v6.jpg"><img src="native-600x360-v6.jpg" alt="600 x 360" loading="lazy"></a><figcaption>600 x 360<span>Short window: readable initial scale; scroll to reach the rest of the skin.</span></figcaption></figure>
<figure><a href="native-768x900-v6.jpg"><img src="native-768x900-v6.jpg" alt="768 x 900" loading="lazy"></a><figcaption>768 x 900<span>Tablet: scope tabs and a vertical instrument strip.</span></figcaption></figure>
<figure><a href="native-1100x800-v6.jpg"><img src="native-1100x800-v6.jpg" alt="1100 x 800" loading="lazy"></a><figcaption>1100 x 800<span>Wide tablet: persistent properties and exact colour controls.</span></figcaption></figure>
<figure><a href="native-1440x900-v6.jpg"><img src="native-1440x900-v6.jpg" alt="1440 x 900" loading="lazy"></a><figcaption>1440 x 900<span>Desktop: source previews, canvas and current properties.</span></figcaption></figure>
<figure><a href="native-1920x1080-v6.jpg"><img src="native-1920x1080-v6.jpg" alt="1920 x 1080" loading="lazy"></a><figcaption>1920 x 1080<span>Large desktop: state previews sit beside the canvas and current properties.</span></figcaption></figure>
<figure><a href="native-pan-v6.jpg"><img src="native-pan-v6.jpg" alt="Pan selected" loading="lazy"></a><figcaption>Pan selected<span>Navigation replaces paint properties and returns their height to the canvas.</span></figcaption></figure>
<figure><a href="native-notice-v6.jpg"><img src="native-notice-v6.jpg" alt="Action error" loading="lazy"></a><figcaption>Action error<span>A dismissible glass notice at the bottom right. Drawing creates no notice.</span></figcaption></figure>
