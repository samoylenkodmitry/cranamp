[package]
name = "cranamp"
version = "0.1.92"
edition = "2021"
description = "A music player in Rust with WSZ skins and an agent-connected Skin Studio."
license = "Apache-2.0"
repository = "https://github.com/samoylenkodmitry/cranamp"
publish = false
autotests = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "cranamp"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "cranamp-ios"
path = "src/ios_main.rs"
required-features = ["ios"]

[[bin]]
name = "cranamp-audio-audit"
path = "test/audio_device_audit.rs"
required-features = ["ios", "audio-audit"]

[[bin]]
name = "cranamp-playback-probe"
path = "test/desktop_playback_probe.rs"
required-features = ["desktop", "audio-audit"]

[[bin]]
name = "cranamp-media-session-probe"
path = "test/media_session_probe.rs"
required-features = ["desktop", "audio-audit"]

[[test]]
name = "studio_drawing_e2e"
path = "test/studio_drawing_e2e.rs"

[[test]]
name = "platform_entry_points"
path = "test/platform_entry_points.rs"

[[test]]
name = "web_has_no_filesystem"
path = "test/web_has_no_filesystem.rs"

[[test]]
name = "settings_e2e"
path = "test/settings_e2e.rs"

[[test]]
name = "studio_handset_e2e"
path = "test/studio_handset_e2e.rs"

[[test]]
name = "studio_mcp_e2e"
path = "test/studio_mcp_e2e.rs"

[[test]]
name = "bundled_skins_are_portable"
path = "test/bundled_skins_are_portable.rs"

[[test]]
name = "skin_cursors_e2e"
path = "test/skin_cursors_e2e.rs"

[[test]]
name = "test_location"
path = "test/test_location.rs"

[[bin]]
name = "cranamp-studio-review"
path = "test/studio_layout_preview.rs"
required-features = ["desktop", "studio-review"]

[[bin]]
name = "cranamp-desktop-navigation-review"
path = "test/desktop_navigation_preview.rs"
required-features = ["desktop", "studio-review"]

[features]
studio-review = []
audio-audit = []
# Store and repository packages receive updates from their distributor.
store = []
default = ["renderer-wgpu", "desktop"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
renderer-pixels = ["cranpose/renderer-pixels"]
desktop = [
    "cranpose/robot",
    "cranpose/desktop",
    "cranpose/media",
    "cranpose-services/file-picker-native",
    "cranpose-services/http-native",
]
desktop-x11 = [
    "cranpose/desktop-x11",
    "cranpose/media",
    "cranpose-services/file-picker-native",
    "cranpose-services/http-native",
]
desktop-wayland = [
    "cranpose/desktop-wayland",
    "cranpose/media",
    "cranpose-services/file-picker-native",
    "cranpose-services/http-native",
]
android = ["cranpose/android", "cranpose/media", "cranpose-services/http-native"]
ios = ["cranpose/ios", "cranpose/media", "renderer-wgpu", "cranpose-services/http-native"]
web = [
    "cranpose/web",
    "cranpose-services/file-picker-web",
    "cranpose-services/web-http",
    "dep:console_error_panic_hook",
    "dep:getrandom_03",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:wasm-logger",
]
logging = ["dep:env_logger"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
clone_on_copy = "deny"
redundant_locals = "deny"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphonia = { version = "0.6.1", default-features = false, features = ["all-formats", "all-meta", "flac", "mp1", "mp2", "mp3"] }
coroflow = "0.17.2"
cranpose = { version = "0.17.2", default-features = false }
cranpose-core = "0.17.2"
cranpose-animation = "0.17.2"
cranpose-coroflow = "0.17.2"
cranpose-foundation = "0.17.2"
cranpose-services = { version = "0.17.2", default-features = false }
cranpose-ui = { version = "0.17.2", features = ["svg"] }
cranpose-ui-graphics = "0.17.2"
cranpose-ui-layout = "0.17.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
log = "0.4"
web-time = "1.1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
env_logger = { version = "0.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-logger = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cranpose-app-shell = "0.17.2"
cranpose-render-common = "0.17.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-lite = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Media", "Win32_Foundation", "Win32_System_WinRT", "Storage_Streams"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dist-min]
inherits = "release-small"
panic = "abort"

[build-dependencies]
cranpose-capabilities = "0.17.2"
embed-resource = "3.0.11"

# Pin the Android window and stylus fixes until the next framework release.
[patch.crates-io]
coroflow = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
cranpose = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
cranpose-animation = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
cranpose-app-shell = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
cranpose-audio = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
