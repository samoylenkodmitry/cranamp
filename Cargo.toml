cranpose-foundation = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
cranpose-gl-templates = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
cranpose-liquid = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
cranpose-macros = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
cranpose-media = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
cranpose-platform-android = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "f6bbc06b30898c8afa04e39fb12d155b7ee23142" }
