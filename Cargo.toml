[package]
name = "cranamp"
version = "0.1.67"
edition = "2021"
description = "A Cranpose-powered Winamp-style multiplatform audio player."
license = "Apache-2.0"
repository = "https://github.com/samoylenkodmitry/cranamp"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "cranamp"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "cranamp-ios"
path = "src/ios_main.rs"
required-features = ["ios"]

[features]
default = ["renderer-wgpu", "desktop"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
renderer-pixels = ["cranpose/renderer-pixels"]
desktop = [
    "cranpose/robot",
    "cranpose/desktop",
    "cranpose/media",
    "cranpose-services/file-picker-native",
    "cranpose-services/http-native",
]
desktop-x11 = [
    "cranpose/desktop-x11",
    "cranpose/media",
    "cranpose-services/file-picker-native",
    "cranpose-services/http-native",
]
desktop-wayland = [
    "cranpose/desktop-wayland",
    "cranpose/media",
    "cranpose-services/file-picker-native",
    "cranpose-services/http-native",
]
android = ["cranpose/android", "cranpose/media", "cranpose-services/http-native"]
ios = ["cranpose/ios", "renderer-wgpu", "cranpose-services/http-native"]
web = [
    "cranpose/web",
    "cranpose-services/file-picker-web",
    "cranpose-services/web-http",
    "dep:console_error_panic_hook",
    "dep:getrandom_03",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:wasm-logger",
]
logging = ["dep:env_logger"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
clone_on_copy = "deny"
redundant_locals = "deny"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cranpose = { version = "0.1.138", default-features = false }
cranpose-core = "0.1.138"
cranpose-foundation = "0.1.138"
cranpose-services = { version = "0.1.138", default-features = false }
cranpose-ui = "0.1.138"
cranpose-ui-graphics = "0.1.138"
getrandom = { version = "0.4", features = ["wasm_js"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
log = "0.4"
web-time = "1.1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
env_logger = { version = "0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-logger = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cranpose-app-shell = "0.1.138"
cranpose-render-common = "0.1.138"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dist-min]
inherits = "release-small"
panic = "abort"

[build-dependencies]
cranpose-capabilities = "0.1.138"
