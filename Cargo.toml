[package]
name = "cranamp"
version = "0.1.38"
edition = "2021"
description = "A Cranpose-powered Winamp-style multiplatform audio player."
license = "Apache-2.0"
repository = "https://github.com/samoylenkodmitry/cranamp"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "cranamp"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "cranamp-ios"
path = "src/ios_main.rs"
required-features = ["ios"]

[features]
default = ["renderer-wgpu", "desktop"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
renderer-pixels = ["cranpose/renderer-pixels"]
desktop = [
    "cranpose/desktop",
    "cranpose-services/file-picker-native",
    "native-audio",
    "native-dialogs",
]
# Per-display-server variants for size-critical release builds.
desktop-x11 = [
    "cranpose/desktop-x11",
    "cranpose-services/file-picker-native",
    "native-audio",
    "native-dialogs",
]
desktop-wayland = [
    "cranpose/desktop-wayland",
    "cranpose-services/file-picker-native",
    "native-audio",
    "native-dialogs",
]
android = ["cranpose/android", "native-audio"]
ios = ["cranpose/ios", "renderer-wgpu", "native-audio"]
web = [
    "cranpose/web",
    "cranpose-services/file-picker-web",
    "dep:console_error_panic_hook",
    "dep:futures-channel",
    "dep:getrandom_03",
    "dep:js-sys",
    "dep:rfd",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:wasm-logger",
    "dep:web-sys",
]
native-audio = ["dep:rodio", "dep:symphonia"]
native-dialogs = ["dep:rfd", "dep:walkdir"]
logging = ["dep:env_logger"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
clone_on_copy = "deny"
redundant_locals = "deny"

[dependencies]
anyhow = "1.0"
cranpose = { version = "0.1.28", default-features = false }
cranpose-core = "0.1.28"
cranpose-foundation = "0.1.28"
cranpose-services = { version = "0.1.28", default-features = false }
cranpose-ui = "0.1.28"
cranpose-ui-graphics = "0.1.28"
getrandom = { version = "0.4", features = ["wasm_js"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
log = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback"], optional = true }
symphonia = { version = "0.6.0", default-features = false, features = ["all-codecs", "all-formats"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
env_logger = { version = "0.11", optional = true }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
walkdir = { version = "2.5", optional = true }
x11rb = "0.13.2"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
futures-channel = { version = "0.3", optional = true }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
js-sys = { version = "0.3", optional = true }
rfd = { version = "0.17.2", default-features = false, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-logger = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob",
    "Document",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAudioElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "Storage",
    "Url",
    "Window",
] }

# Framework-level e2e tests drive the real cranpose hit-dispatch pipeline
# headlessly (see tests/settings_e2e.rs). Published crates, same 0.1.28 as the
# cranpose runtime deps above.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cranpose-app-shell = "0.1.28"
cranpose-render-common = "0.1.28"

# Distribution profile: LTO + strip + abort panics keep the binary small
# (see cranpose README "Binary Size").
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"


# Size-optimized distribution profile (see cranpose docs/binary_size.md).
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"

# Nightly size floor: abort panics + size-tuned std (build-std).
# (`immediate-abort` was removed from nightly cargo ~2026-03; plain abort
# costs only the panic-formatting shims relative to it.)
[profile.dist-min]
inherits = "release-small"
panic = "abort"
