[package]
name = "cranamp"
version = "0.1.50"
edition = "2021"
description = "A Cranpose-powered Winamp-style multiplatform audio player."
license = "Apache-2.0"
repository = "https://github.com/samoylenkodmitry/cranamp"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "cranamp"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "cranamp-ios"
path = "src/ios_main.rs"
required-features = ["ios"]

[features]
default = ["renderer-wgpu", "desktop"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
renderer-pixels = ["cranpose/renderer-pixels"]
desktop = [
    "cranpose/desktop",
    "cranpose/media",
    "cranpose-services/file-picker-native",
]
# Per-display-server variants for size-critical release builds.
desktop-x11 = [
    "cranpose/desktop-x11",
    "cranpose/media",
    "cranpose-services/file-picker-native",
]
desktop-wayland = [
    "cranpose/desktop-wayland",
    "cranpose/media",
    "cranpose-services/file-picker-native",
]
android = ["cranpose/android", "cranpose/media"]
ios = ["cranpose/ios", "renderer-wgpu"]
web = [
    "cranpose/web",
    "cranpose-services/file-picker-web",
    "dep:console_error_panic_hook",
    "dep:getrandom_03",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:wasm-logger",
]
logging = ["dep:env_logger"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
clone_on_copy = "deny"
redundant_locals = "deny"

[dependencies]
anyhow = "1.0"
# 0.1.98 carries Cranpose PR #463, which deletes the `android/` Maven module
# tree and moves the Gradle plugin inside this crate
# (`android/cranpose-gradle-plugin/`), resolved by `settings.gradle.kts` via
# `cargo metadata` + `includeBuild` instead of a Maven coordinate/version. It
# also carries cranpose_services::content's shared percent_decode/
# percent_decode_lossy pair, which src/sync/mod.rs below depends on to drop
# its own hand-rolled percent-decoder.
cranpose = { version = "0.1.115", default-features = false }
cranpose-core = "0.1.115"
cranpose-foundation = "0.1.115"
cranpose-services = { version = "0.1.115", default-features = false }
cranpose-ui = "0.1.115"
cranpose-ui-graphics = "0.1.115"
getrandom = { version = "0.4", features = ["wasm_js"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
log = "0.4"
web-time = "1.1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
env_logger = { version = "0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-logger = { version = "0.2", optional = true }

# Framework-level e2e tests drive the real cranpose hit-dispatch pipeline
# headlessly (see tests/settings_e2e.rs). Published crates, pinned to the same
# cranpose release as the runtime dependencies above.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cranpose-app-shell = "0.1.115"
cranpose-render-common = "0.1.115"

# Distribution profile: LTO + strip + abort panics keep the binary small
# (see cranpose README "Binary Size").
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"


# Size-optimized distribution profile (see cranpose docs/binary_size.md).
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"

# Nightly size floor: abort panics + size-tuned std (build-std).
# (`immediate-abort` was removed from nightly cargo ~2026-03; plain abort
# costs only the panic-formatting shims relative to it.)
[profile.dist-min]
inherits = "release-small"
panic = "abort"
