name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Hosted runners only, and never `~/.cargo/bin` -- see release.yml.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-bin: false
      - name: Install Linux audio/dialog dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Check native
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Check wasm
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features web,renderer-wgpu

  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Hosted runners only, and never `~/.cargo/bin` -- see release.yml.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-bin: false
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build wasm widget
        run: ./build-web.sh

  ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      # Hosted runners only, and never `~/.cargo/bin` -- see release.yml.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-bin: false
      - name: Clippy iOS (simulator)
        run: cargo clippy --bin cranamp-ios --target aarch64-apple-ios-sim --no-default-features --features ios -- -D warnings
      - name: Build iOS device binary
        run: cargo build --bin cranamp-ios --target aarch64-apple-ios --no-default-features --features ios
      - name: Assemble simulator .app bundle
        run: platform/ios/build-app.sh aarch64-apple-ios-sim
