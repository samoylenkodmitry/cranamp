name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-bin: false
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install cranpose-build
        run: |
          base=https://github.com/samoylenkodmitry/cranpose-build/releases/download/v0.3.0
          curl -fsSLO "$base/cranpose-build-x86_64-unknown-linux-gnu.zip"
          curl -fsSLO "$base/cranpose-build-x86_64-unknown-linux-gnu.zip.sha256"
          sha256sum -c cranpose-build-x86_64-unknown-linux-gnu.zip.sha256
          mkdir -p "$HOME/.local/bin"
          unzip -q cranpose-build-x86_64-unknown-linux-gnu.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate offline license notices
        uses: ./.github/actions/store-notices
        with:
          target: wasm32-unknown-unknown
          features: web,renderer-wgpu
      - name: Build widget
        run: ./build-web.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
