name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop:
    if: github.event_name == 'push'
    concurrency: release-${{ matrix.platform }}
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.runner || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cranamp-linux-x86_64
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/dist-min/cranamp
            archive: tar.gz
            extra_rustflags: " -Cforce-unwind-tables=no -Clink-arg=-fuse-ld=lld -Clink-arg=-Wl,--icf=all"
          - os: macos-latest
            runner: [self-hosted, macOS, ARM64]
            artifact: cranamp-macos
            platform: macos
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/dist-min/cranamp
            archive: tar.gz
            extra_rustflags: " -Cforce-unwind-tables=no"
          - os: windows-latest
            artifact: cranamp-windows-x86_64
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/dist-min/cranamp.exe
            archive: zip
            extra_rustflags: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-bin: false
      - name: Install Linux audio/dialog dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config lld
      - name: Import the Developer ID certificate
        if: matrix.platform == 'macos'
        id: devid
        shell: bash
        env:
          P12_BASE64: ${{ secrets.CRANAMP_MACOS_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CRANAMP_MACOS_DEVID_P12_PASSWORD }}
        run: bash scripts/release/macos-signing.sh prepare
      - name: Build (dist-min)
        shell: bash
        env:
          DIST_MIN_RUSTFLAGS: >-
            -Cpanic=immediate-abort -Zunstable-options
            -Zlocation-detail=none${{ matrix.extra_rustflags }}
        run: >
          RUSTFLAGS="$DIST_MIN_RUSTFLAGS"
          cargo build --profile dist-min
          --target ${{ matrix.target }}
          -Zbuild-std=std,panic_abort
          -Zbuild-std-features=optimize_for_size
      - name: Package artifact
        shell: bash
        env:
          ASC_P8_BASE64: ${{ secrets.CRANAMP_ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.CRANAMP_ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CRANAMP_ASC_API_ISSUER_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_dir="release/cranamp-${version}-${{ matrix.platform }}"
          mkdir -p "$package_dir/demo-music" assets
          if [ "${{ matrix.platform }}" = "macos" ]; then
            app="$package_dir/Cranamp.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "${{ matrix.binary }}" "$app/Contents/MacOS/Cranamp"
            cp platform/macos/Info.plist "$app/Contents/Info.plist"
            cp assets/icon/Cranamp.icns "$app/Contents/Resources/Cranamp.icns"
            bash scripts/release/macos-signing.sh sign "$app"
          else
            cp "${{ matrix.binary }}" "$package_dir/"
          fi
          cp README.md LICENSE "$package_dir/"
          mkdir -p "$package_dir/skins"
          cp "assets/skins/Catamp Silverplay.wsz" "$package_dir/skins/"
          cp "assets/skins/Catamp Feral Night.wsz" "assets/skins/Catamp Cardboard.wsz" \
             "assets/skins/Catamp Sampler.wsz" "assets/skins/Catamp Cat Scan.wsz" \
             "assets/skins/Catamp Seance.wsz" "assets/skins/Catamp Salvage.wsz" \
             "assets/skins/Catamp Freefall.wsz" \
             "assets/skins/Catamp Catnip.wsz" "assets/skins/Catamp Moon Garden.wsz" \
             "assets/skins/Catamp Midnight Snack.wsz" \
             "$package_dir/skins/"
          cp assets/demo-music/generated/*.mp3 "$package_dir/demo-music/"
          cp assets/demo-music/generated/cranamp-demo-playlist.m3u "$package_dir/demo-music/"
          cp assets/demo-music/README.md assets/demo-music/LICENSES.md "$package_dir/demo-music/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -Command "Compress-Archive -Path '$package_dir/*' -DestinationPath 'assets/cranamp-${version}-${{ matrix.platform }}.zip'"
          else
            tar -czf "assets/cranamp-${version}-${{ matrix.platform }}.tar.gz" -C release "cranamp-${version}-${{ matrix.platform }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: assets/cranamp-*
          retention-days: 1

      - name: Restore the keychain search list
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: bash scripts/release/macos-signing.sh cleanup

  android:
    if: github.event_name == 'push'
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-bin: false
      - name: Install Android NDK and cargo-ndk
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --locked
      - name: Materialize release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CRANAMP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "CRANAMP_RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cranamp-release.jks"
          echo "CRANAMP_RELEASE_KEYSTORE=$RUNNER_TEMP/cranamp-release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: platform/android
        env:
          CRANAMP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CRANAMP_RELEASE_KEYSTORE_PASSWORD }}
          CRANAMP_RELEASE_KEY_ALIAS: ${{ secrets.CRANAMP_RELEASE_KEY_ALIAS }}
          CRANAMP_RELEASE_KEY_PASSWORD: ${{ secrets.CRANAMP_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK is release-signed
        shell: bash
        run: |
          for apk in platform/android/app/build/outputs/apk/release/app-*-release.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | tee -a certs.txt
          done
          grep -q "CN=Cranamp" certs.txt || { echo "APK is not signed with the Cranamp release key"; exit 1; }
      - name: Stage APK
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p assets
          for apk in platform/android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-\(.*\)-release\.apk$/\1/')
            cp "$apk" "assets/cranamp-${version}-android-${abi}.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: cranamp-android
          path: assets/cranamp-*
          retention-days: 1

  web:
    if: github.event_name == 'push'
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-bin: false
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build widget
        run: ./build-web.sh
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -czf "cranamp-${version}-web.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: cranamp-web
          path: cranamp-*-web.tar.gz
          retention-days: 1

  ios:
    if: github.event_name == 'push'
    name: iOS
    runs-on: [self-hosted, macOS, apple-signing]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-bin: false
      - name: Build device .app bundle
        run: PROFILE=release platform/ios/build-app.sh aarch64-apple-ios
      - name: Build simulator .app bundle
        run: PROFILE=release platform/ios/build-app.sh aarch64-apple-ios-sim
      - name: Package sideloadable .ipa (device) and simulator .app
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p assets

          payload="$RUNNER_TEMP/Payload"
          rm -rf "$payload"
          mkdir -p "$payload"
          cp -R "target/aarch64-apple-ios/release/Cranamp.app" "$payload/"
          (cd "$RUNNER_TEMP" && zip -qry "ipa.zip" Payload)
          mv "$RUNNER_TEMP/ipa.zip" "assets/cranamp-${version}-ios.ipa"

          (cd "target/aarch64-apple-ios-sim/release" && zip -qry "$RUNNER_TEMP/sim.zip" Cranamp.app)
          mv "$RUNNER_TEMP/sim.zip" "assets/cranamp-${version}-ios-simulator.app.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: cranamp-ios
          path: assets/cranamp-*
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    name: Publish GitHub Release
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          body: |
            Cranamp release assets for desktop, Android, iOS, and the WebAssembly widget.

            macOS: the Apple Silicon `.app` is signed with Developer ID, notarized by Apple, and includes a stapled notarization ticket.

            iOS:
            - `…-ios.ipa` — device build, ad-hoc signed for sideloading (AltStore / Sideloadly).
            - `…-ios-simulator.app.zip` — Simulator build. Unzip, then with a Simulator booted run `xcrun simctl install booted Cranamp.app` (or drag `Cranamp.app` onto the Simulator window). A device `.ipa` cannot run on a Simulator.

            Web widget: https://samoylenkodmitry.github.io/cranamp/
          files: artifacts/**/*

  publish-ios:
    if: github.event_name == 'push'
    name: Attach iOS Assets
    needs: [ios, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cranamp-ios
          path: artifacts
      - name: Attach the iOS assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"

  verify-macos-signing:
    if: github.event_name == 'workflow_dispatch'
    name: Verify Mac signing and notarization
    runs-on: [self-hosted, macOS, ARM64]
    concurrency: release-macos
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.CRANAMP_MACOS_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CRANAMP_MACOS_DEVID_P12_PASSWORD }}
        run: bash scripts/release/macos-signing.sh prepare
      - name: Download the current Mac release for verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/distribution/version.py)
          check_dir="$RUNNER_TEMP/cranamp-signing-check"
          mkdir -p "$check_dir"
          gh release download "v$version" --pattern "cranamp-$version-macos.tar.gz" --dir "$check_dir"
          tar -xzf "$check_dir/cranamp-$version-macos.tar.gz" -C "$check_dir"
          echo "CRANAMP_CHECK_APP=$check_dir/cranamp-$version-macos/Cranamp.app" >> "$GITHUB_ENV"
      - name: Sign, notarize and validate the app
        env:
          ASC_P8_BASE64: ${{ secrets.CRANAMP_ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.CRANAMP_ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CRANAMP_ASC_API_ISSUER_ID }}
        run: bash scripts/release/macos-signing.sh sign "$CRANAMP_CHECK_APP"
      - name: Save notarization receipt
        uses: actions/upload-artifact@v7
        with:
          name: macos-notarization-receipt
          path: ${{ env.CRANAMP_SIGN_STATE }}/notarization.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          bash scripts/release/macos-signing.sh cleanup
          rm -rf "$RUNNER_TEMP/cranamp-signing-check"
