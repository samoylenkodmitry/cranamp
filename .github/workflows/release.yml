name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.runner || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cranamp-linux-x86_64
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/dist-min/cranamp
            archive: tar.gz
            # lld's --icf=all folds identical functions (ELF-only);
            # unwind tables are droppable everywhere except MSVC (SEH).
            extra_rustflags: " -Cforce-unwind-tables=no -Clink-arg=-fuse-ld=lld -Clink-arg=-Wl,--icf=all"
          - os: macos-latest
            runner: [self-hosted, macOS, ARM64]
            artifact: cranamp-macos
            platform: macos
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/dist-min/cranamp
            archive: tar.gz
            extra_rustflags: " -Cforce-unwind-tables=no"
          - os: windows-latest
            artifact: cranamp-windows-x86_64
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/dist-min/cranamp.exe
            archive: zip
            extra_rustflags: ""
    steps:
      - uses: actions/checkout@v6
      # dist-min needs nightly cargo with build-std (rust-src).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src
      # `cache-bin` is left off deliberately. It defaults to on and makes
      # rust-cache treat `~/.cargo/bin` as its own: it restores that directory
      # and prunes it on save. On a GitHub-hosted runner that is
      # `/Users/runner/.cargo/bin`, thrown away with the VM. On a self-hosted
      # one it is the machine's actual toolchain, and the prune deletes the
      # real files while leaving the symlinks -- which took `rustup` off two
      # Macs in one afternoon and left every shim pointing at nothing. Set on
      # every job, so moving one onto a self-hosted runner cannot quietly
      # bring it back.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install Linux audio/dialog dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config lld
      - name: Import the Developer ID certificate
        if: matrix.platform == 'macos'
        id: devid
        shell: bash
        env:
          P12_BASE64: ${{ secrets.CRANAMP_MACOS_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CRANAMP_MACOS_DEVID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ]; then
            echo "::notice::No CRANAMP_MACOS_DEVID_P12_BASE64 secret, so the .app stays ad-hoc signed and Gatekeeper keeps blocking downloads."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/cranamp-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          trap 'rm -f "$RUNNER_TEMP/devid.p12"' EXIT
          (umask 177; printf '%s' "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/devid.p12")
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          # `-l` (lock on sleep) is deliberately NOT set. This runner is a
          # laptop, signing happens in a later step minutes after this one, and
          # a keychain that locks when the lid closes mid-build takes the
          # release down with `errSecInternalComponent`.
          security set-keychain-settings -ut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12

          # The p12 carries the leaf and its key, not the intermediate that
          # links it to Apple Root CA. codesign builds the chain out of the
          # keychains it searches, and this host has no Apple CA in any of
          # them -- `security find-certificate -c "Developer ID Certification
          # Authority"` finds it only in SystemRootCertificates, which is the
          # anchor store and not searched for intermediates. Signing then dies
          # on
          #
          #   Warning: unable to build chain to self-signed root for signer ...
          #   Cranamp.app: errSecInternalComponent
          #
          # which names the chain correctly and gets read as a broken key.
          # Note `security find-identity -v` still lists the identity as valid,
          # so the guard below is no protection against this.
          #
          # Fetched rather than vendored, and pinned by digest so a swapped
          # download cannot put an attacker's CA into the keychain we sign
          # with. G2 is the issuer of current Developer ID leaves and is valid
          # until 2031-09-17.
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused \
            --location --silent --show-error --fail \
            --output "$intermediate" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          expected=f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
          actual="$(shasum -a 256 "$intermediate" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Developer ID G2 intermediate digest mismatch: got $actual" >&2
            exit 1
          fi
          # Idempotent: the p12 may already carry this certificate, and
          # `security import` treats a duplicate as an error.
          if ! security import "$intermediate" -k "$KEYCHAIN" -T /usr/bin/codesign \
               > "$RUNNER_TEMP/import.log" 2>&1; then
            if grep -q "already exists" "$RUNNER_TEMP/import.log"; then
              echo "Developer ID G2 intermediate was already in the keychain"
            else
              cat "$RUNNER_TEMP/import.log" >&2
              exit 1
            fi
          fi
          rm -f "$intermediate"

          # What the keychain actually holds, and whether the chain evaluates.
          # Printed unconditionally because the failure this guards against
          # reports "unable to build chain to self-signed root" without saying
          # which link is missing, and two wrong diagnoses came out of
          # inferring it instead of looking.
          echo "== certificates in the signing keychain =="
          security find-certificate -a "$KEYCHAIN" \
            | grep -E '"(labl|issu)"' || echo "(none)"
          echo "== chain evaluation for the leaf =="
          security find-certificate -a -c "Developer ID Application" -p "$KEYCHAIN" \
            > "$RUNNER_TEMP/leaf.pem" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/leaf.pem" ]; then
            security verify-cert -c "$RUNNER_TEMP/leaf.pem" -p codeSign \
              -k "$KEYCHAIN" || echo "verify-cert reported the chain as unusable"
          else
            echo "(no Developer ID Application certificate exported)"
          fi
          rm -f "$RUNNER_TEMP/leaf.pem"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null

          # AFTER the partition list. Read before it, `find-identity` reports
          # "0 valid identities found" on a keychain that signs perfectly well
          # a line later, which is a diagnostic that creates a false lead.
          echo "== codesigning identities =="
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          # Record the search list so the cleanup step can put it back, then
          # set it to this keychain plus the entries that still exist.
          #
          # Appending the CURRENT list, which is what this did before, re-adds
          # this very path: `RUNNER_TEMP` is a fixed directory for a given
          # runner, so the keychain is always
          # `.../_temp/cranamp-signing.keychain-db`, and the previous run left
          # that path in the user's search list. The runner then wipes `_temp`
          # between jobs, so the entry survives as a dangling path pointing at
          # a keychain that no longer exists. codesign walks the search list to
          # build the certificate chain, hits the dead entry, and fails with
          # `errSecInternalComponent` behind the warning "unable to build chain
          # to self-signed root" -- which reads like a missing intermediate and
          # is not one. That is why the macOS job failed every other release:
          # v0.1.37 passed, .38 failed, .39 passed, .40 failed, .41 passed,
          # .42 failed.
          #
          # The search list is USER-level state on a self-hosted runner. It
          # outlives the job, so a job that changes it has to change it back.
          security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//' \
            > "$RUNNER_TEMP/keychains-before.txt"
          keep=()
          while IFS= read -r existing; do
            [ -n "$existing" ] || continue
            [ "$existing" = "$KEYCHAIN" ] && continue
            [ -e "$existing" ] || continue
            keep+=("$existing")
          done < "$RUNNER_TEMP/keychains-before.txt"
          security list-keychains -d user -s "$KEYCHAIN" "${keep[@]}"
          rm -f "$RUNNER_TEMP/devid.p12"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/{print $2; exit}')"
          [ -n "$identity" ] || { echo "the p12 holds no Developer ID Application certificate" >&2; exit 1; }
          echo "CRANAMP_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CRANAMP_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # The signing step has to be able to unlock this itself; unlocking
          # here does not survive the minutes of build between the two steps.
          # The password is random and lives only as long as this job.
          echo "::add-mask::$KEYCHAIN_PASS"
          echo "CRANAMP_SIGN_KEYCHAIN_PASS=$KEYCHAIN_PASS" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # Size-minimized distribution build: abort panics without location
      # strings, no Debug formatting, no unwind tables, size-tuned std
      # (see cranpose docs/binary_size.md for the recipe and trade-offs).
      - name: Build (dist-min)
        shell: bash
        env:
          DIST_MIN_RUSTFLAGS: >-
            -Cpanic=immediate-abort -Zunstable-options
            -Zlocation-detail=none -Zfmt-debug=none${{ matrix.extra_rustflags }}
        run: >
          RUSTFLAGS="$DIST_MIN_RUSTFLAGS"
          cargo build --profile dist-min
          --target ${{ matrix.target }}
          -Zbuild-std=std,panic_abort
          -Zbuild-std-features=optimize_for_size
      - name: Package artifact
        shell: bash
        env:
          ASC_P8_BASE64: ${{ secrets.CRANAMP_ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.CRANAMP_ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CRANAMP_ASC_API_ISSUER_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_dir="release/cranamp-${version}-${{ matrix.platform }}"
          mkdir -p "$package_dir/demo-music" assets
          if [ "${{ matrix.platform }}" = "macos" ]; then
            # Ship a sealed .app bundle. macOS Finder runs a bare Unix binary
            # inside a Terminal window, and an unsealed bundle is reported as
            # "damaged" once downloaded (quarantined). Assemble and ad-hoc sign
            # so the seal is valid.
            signed_devid=0
            app="$package_dir/Cranamp.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "${{ matrix.binary }}" "$app/Contents/MacOS/Cranamp"
            cp platform/macos/Info.plist "$app/Contents/Info.plist"
            if [ "${{ steps.devid.outputs.signed }}" = "true" ]; then
              # Unlock HERE, not once at import time. The keychain was unlocked
              # minutes ago in another step, and everything between then and
              # now -- a full release build on a laptop that may sleep -- can
              # relock it. A locked keychain does not report itself as locked:
              # codesign fails with
              #
              #   Warning: unable to build chain to self-signed root for signer ...
              #   errSecInternalComponent
              #
              # which names the certificate chain and cost two wrong fixes.
              # `security verify-cert -p codeSign` on the very same keychain
              # answers "certificate verification successful", so the chain is
              # provably not the fault.
              security unlock-keychain -p "$CRANAMP_SIGN_KEYCHAIN_PASS" \
                "$CRANAMP_SIGN_KEYCHAIN"
              # A Developer ID signature with the hardened runtime and a
              # timestamp is what notarytool accepts.
              #
              # A release is worth more than a signature. Two runners answer
              # this job's labels and only one can codesign -- the other runs
              # under launchd with no GUI login session, where this fails with
              # `errSecInternalComponent` on a keychain whose chain
              # `security verify-cert -p codeSign` calls successful. Rather
              # than let which machine picked the job decide whether the app
              # ships, fall back to an ad-hoc signature and say so loudly.
              # Ad-hoc means Gatekeeper blocks a download until the user
              # clears the quarantine, which is worse than notarized and much
              # better than no build at all.
              if codesign --force --deep --options runtime --timestamp \
                   --keychain "$CRANAMP_SIGN_KEYCHAIN" \
                   --sign "$CRANAMP_SIGN_IDENTITY" "$app"; then
                signed_devid=1
              else
                echo "::warning::Developer ID signing failed on this runner; falling back to an ad-hoc signature. The .app is NOT notarized and Gatekeeper will block it until the quarantine flag is cleared."
                echo "- macOS: **ad-hoc signed, not notarized** (Developer ID signing failed on the runner)" >> "$GITHUB_STEP_SUMMARY"
                codesign --force --deep --sign - "$app"
              fi
            else
              codesign --force --deep --sign - "$app"
            fi
            codesign --verify --strict --verbose=2 "$app"
            # A shell variable, NOT `$GITHUB_ENV`: that only reaches later
            # steps and notarization runs in this one, so it would read empty
            # here and skip notarizing a perfectly good signature.
            #
            # And `signed_devid` rather than `steps.devid.outputs.signed`: the
            # identity being available is not the same as the signature having
            # been produced, and notarytool rejects an ad-hoc one.
            if [ "${signed_devid:-}" = "1" ] && [ -n "$ASC_P8_BASE64" ]; then
              # Notarize, then staple the ticket into the bundle so a download
              # opens with no network check and no warning.
              key="$RUNNER_TEMP/asc.p8"
              trap 'rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/cranamp-notarize.zip"' EXIT
              (umask 177; printf '%s' "$ASC_P8_BASE64" | base64 -d > "$key")
              ditto -c -k --keepParent "$app" "$RUNNER_TEMP/cranamp-notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/cranamp-notarize.zip" \
                --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
              rm -f "$key" "$RUNNER_TEMP/cranamp-notarize.zip"
              xcrun stapler staple "$app"
              spctl --assess --type execute --verbose=2 "$app"
            fi
          else
            cp "${{ matrix.binary }}" "$package_dir/"
          fi
          cp README.md LICENSE "$package_dir/"
          cp assets/demo-music/generated/*.mp3 "$package_dir/demo-music/"
          cp assets/demo-music/generated/cranamp-demo-playlist.m3u "$package_dir/demo-music/"
          cp assets/demo-music/README.md assets/demo-music/LICENSES.md "$package_dir/demo-music/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -Command "Compress-Archive -Path '$package_dir/*' -DestinationPath 'assets/cranamp-${version}-${{ matrix.platform }}.zip'"
          else
            tar -czf "assets/cranamp-${version}-${{ matrix.platform }}.tar.gz" -C release "cranamp-${version}-${{ matrix.platform }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: assets/cranamp-*
          # Handoff to the publish job below, which is the only consumer.
          # The pool this lands in is 500 MB shared across every repository
          # on the account, so it holds these only as long as the run needs.
          retention-days: 1

      # `always()`, because the whole point is that a FAILED signing job must
      # not leave the runner's user keychain search list pointing at a keychain
      # that is about to be deleted. Without this the next release inherits the
      # dead entry and fails in codesign for a reason that names neither this
      # job nor this file.
      - name: Restore the keychain search list
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          set -uo pipefail
          if [ -f "$RUNNER_TEMP/keychains-before.txt" ]; then
            keep=()
            while IFS= read -r existing; do
              [ -n "$existing" ] || continue
              [ -e "$existing" ] || continue
              keep+=("$existing")
            done < "$RUNNER_TEMP/keychains-before.txt"
            if [ ${#keep[@]} -gt 0 ]; then
              security list-keychains -d user -s "${keep[@]}"
            fi
          fi
          security delete-keychain "$RUNNER_TEMP/cranamp-signing.keychain-db" 2>/dev/null || true

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      # Never let it manage `~/.cargo/bin` -- see the note in release.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install Android NDK and cargo-ndk
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --locked
      - name: Materialize release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CRANAMP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "CRANAMP_RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cranamp-release.jks"
          echo "CRANAMP_RELEASE_KEYSTORE=$RUNNER_TEMP/cranamp-release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: platform/android
        env:
          CRANAMP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CRANAMP_RELEASE_KEYSTORE_PASSWORD }}
          CRANAMP_RELEASE_KEY_ALIAS: ${{ secrets.CRANAMP_RELEASE_KEY_ALIAS }}
          CRANAMP_RELEASE_KEY_PASSWORD: ${{ secrets.CRANAMP_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK is release-signed
        shell: bash
        run: |
          for apk in platform/android/app/build/outputs/apk/release/app-*-release.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | tee -a certs.txt
          done
          grep -q "CN=Cranamp" certs.txt || { echo "APK is not signed with the Cranamp release key"; exit 1; }
      - name: Stage APK
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p assets
          for apk in platform/android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-\(.*\)-release\.apk$/\1/')
            cp "$apk" "assets/cranamp-${version}-android-${abi}.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: cranamp-android
          path: assets/cranamp-*
          # Handoff to the publish job below, which is the only consumer.
          # The pool this lands in is 500 MB shared across every repository
          # on the account, so it holds these only as long as the run needs.
          retention-days: 1

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Never let it manage `~/.cargo/bin` -- see the note in release.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build widget
        run: ./build-web.sh
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -czf "cranamp-${version}-web.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: cranamp-web
          path: cranamp-*-web.tar.gz
          # Handoff to the publish job below, which is the only consumer.
          # The pool this lands in is 500 MB shared across every repository
          # on the account, so it holds these only as long as the run needs.
          retention-days: 1

  ios:
    name: iOS
    runs-on: [self-hosted, macOS, apple-signing]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      # Never let it manage `~/.cargo/bin` -- see the note in release.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build device .app bundle
        run: PROFILE=release platform/ios/build-app.sh aarch64-apple-ios
      - name: Build simulator .app bundle
        run: PROFILE=release platform/ios/build-app.sh aarch64-apple-ios-sim
      - name: Package sideloadable .ipa (device) and simulator .app
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p assets

          # Device build → .ipa (Payload/Cranamp.app) for sideloading.
          payload="$RUNNER_TEMP/Payload"
          rm -rf "$payload"
          mkdir -p "$payload"
          cp -R "target/aarch64-apple-ios/release/Cranamp.app" "$payload/"
          (cd "$RUNNER_TEMP" && zip -qry "ipa.zip" Payload)
          mv "$RUNNER_TEMP/ipa.zip" "assets/cranamp-${version}-ios.ipa"

          # Simulator build → zipped .app for `xcrun simctl install`.
          (cd "target/aarch64-apple-ios-sim/release" && zip -qry "$RUNNER_TEMP/sim.zip" Cranamp.app)
          mv "$RUNNER_TEMP/sim.zip" "assets/cranamp-${version}-ios-simulator.app.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: cranamp-ios
          path: assets/cranamp-*
          # Handoff to the publish job below, which is the only consumer.
          # The pool this lands in is 500 MB shared across every repository
          # on the account, so it holds these only as long as the run needs.
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [desktop, android, web, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          body: |
            Cranamp release assets for desktop, Android, iOS, and the WebAssembly widget.

            macOS: the `.app` is ad-hoc signed (not notarized), so Gatekeeper blocks it on first launch after download. Right-click `Cranamp.app` → **Open** → **Open**, or run `xattr -dr com.apple.quarantine Cranamp.app`, then launch normally. If you double-click and nothing happens, that is the Gatekeeper block, not a crash.

            iOS:
            - `…-ios.ipa` — device build, ad-hoc signed for sideloading (AltStore / Sideloadly).
            - `…-ios-simulator.app.zip` — Simulator build. Unzip, then with a Simulator booted run `xcrun simctl install booted Cranamp.app` (or drag `Cranamp.app` onto the Simulator window). A device `.ipa` cannot run on a Simulator.

            Web widget: https://samoylenkodmitry.github.io/cranamp/
          files: artifacts/**/*
