name: Store packages

on:
  pull_request:
    paths:
      - '.github/workflows/stores.yml'
      - '.github/actions/store-notices/**'
      - 'scripts/distribution/**'
      - 'platform/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'assets/**'
      - 'about.toml'
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      signed:
        description: Require distribution signing credentials (Apple and Google Play)
        type: boolean
        default: false
      build_number:
        description: Apple build number (empty uses the increasing workflow run number)
        type: string
        default: ''
      apple_status_only:
        description: Read Apple version and review status without building packages
        type: boolean
        default: false
      apple_upload_run:
        description: Upload signed Apple artifacts from this Store packages run instead of building
        type: string
        default: ''
      apple_listing_platform:
        description: Prepare Apple listing only (ios or macos; empty builds packages)
        type: string
        default: ''
      apple_submit_for_review:
        description: Submit the prepared Apple version and selected build for review
        type: boolean
        default: false
      play_upload_run:
        description: Send the signed AAB from this Store packages run to Google Play for review
        type: string
        default: ''
      play_rollout:
        description: Staged rollout fraction for play_upload_run (empty releases to everyone)
        type: string
        default: ''
      msstore_upload_run:
        description: Submit the MSIX from this Store packages run to the Microsoft Store
        type: string
        default: ''
      snap_publish_run:
        description: Release the snap from this Store packages run to the Snap Store stable channel
        type: string
        default: ''
      aur_publish_run:
        description: Attach the Linux archives from this Store packages run to the release and push both AUR recipes
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CRANAMP_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
  CRANAMP_STORE_SIGNED: ${{ inputs.signed == true && 'true' || 'false' }}

jobs:
  apple-listing:
    if: inputs.apple_listing_platform != ''
    runs-on: macos-latest
    timeout-minutes: 20
    concurrency:
      group: apple-listing-${{ inputs.apple_listing_platform }}
      cancel-in-progress: false
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_GITHUB_ISSUES: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_DISABLE_COLORS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v 2.241.2 --no-document
      - name: Stage reviewed listing and screenshots
        env:
          APPLE_PLATFORM: ${{ inputs.apple_listing_platform }}
        run: python3 scripts/distribution/apple-listing.py "$APPLE_PLATFORM" "$RUNNER_TEMP/apple-listing"
      - name: Upload listing and optionally submit for review
        env:
          ASC_P8_BASE64: ${{ secrets.CRANAMP_ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.CRANAMP_ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CRANAMP_ASC_API_ISSUER_ID }}
          APPLE_PLATFORM: ${{ inputs.apple_listing_platform }}
          SUBMIT: ${{ inputs.apple_submit_for_review }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          test -n "$BUILD_NUMBER"
          key_path="$RUNNER_TEMP/apple-listing-key.json"
          trap 'rm -f "$key_path"' EXIT
          export APPLE_LISTING_KEY_PATH="$key_path"
          python3 - <<'PY'
          import base64, json, os
          key = {"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                 "key": base64.b64decode(os.environ["ASC_P8_BASE64"]).decode(), "duration": 1200, "in_house": False}
          fd = os.open(os.environ["APPLE_LISTING_KEY_PATH"], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as output:
              json.dump(key, output)
          PY
          platform=ios
          if [ "$APPLE_PLATFORM" = macos ]; then platform=osx; fi
          cd "$RUNNER_TEMP/apple-listing"
          fastlane deliver --api_key_path "$key_path" --app_identifier io.cranamp.app \
            --platform "$platform" --app_version "$(cat "$RUNNER_TEMP/apple-listing/version.txt")" \
            --build_number "$BUILD_NUMBER" --skip_binary_upload true --force true \
            --metadata_path "$RUNNER_TEMP/apple-listing/metadata" \
            --screenshots_path "$RUNNER_TEMP/apple-listing/screenshots" \
            --overwrite_screenshots true --submit_for_review "$SUBMIT" --automatic_release true \
            --precheck_include_in_app_purchases false --reject_if_possible false
  apple-upload:
    if: inputs.apple_upload_run != ''
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - name: Check source package job
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.apple_upload_run }}
          SOURCE_REPO: ${{ github.repository }}
          APPLE_PLATFORM: ${{ matrix.platform }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN/jobs" > "$RUNNER_TEMP/package-jobs.json"
          python3 - <<'PY'
          import json, os
          jobs = json.load(open(os.environ['RUNNER_TEMP'] + '/package-jobs.json'))['jobs']
          name = 'Apple ' + os.environ['APPLE_PLATFORM']
          assert any(j['name'] == name and j['conclusion'] == 'success' for j in jobs), name + ' did not pass'
          PY
      - uses: actions/download-artifact@v8
        with:
          name: apple-${{ matrix.platform }}-store
          path: apple-upload
          run-id: ${{ inputs.apple_upload_run }}
          github-token: ${{ github.token }}
      - name: Upload signed package to App Store Connect
        env:
          ASC_P8_BASE64: ${{ secrets.CRANAMP_ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.CRANAMP_ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CRANAMP_ASC_API_ISSUER_ID }}
          APPLE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/cranamp-apple-upload-keys"
          mkdir -m 700 "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          (umask 077; printf '%s' "$ASC_P8_BASE64" | base64 -d > "$key_dir/AuthKey_$ASC_KEY_ID.p8")
          export API_PRIVATE_KEYS_DIR="$key_dir"
          if [ "$APPLE_PLATFORM" = ios ]; then extension=ipa; upload_type=ios; else extension=pkg; upload_type=macos; fi
          package=$(find "$GITHUB_WORKSPACE/apple-upload" -name "*.$extension" -type f)
          test -n "$package" && test -f "$package"
          xcrun altool --upload-app -f "$package" -t "$upload_type" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
  play-upload:
    if: inputs.play_upload_run != ''
    runs-on: ubuntu-latest
    concurrency:
      group: play-upload
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check source package job
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.play_upload_run }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN/jobs" --paginate --jq '.jobs[] | select(.name == "Google Play AAB") | .conclusion' | grep -qx success
      - uses: actions/download-artifact@v8
        with:
          name: google-play-bundle
          path: play-upload
          run-id: ${{ inputs.play_upload_run }}
          github-token: ${{ github.token }}
      - run: python3 -m pip install 'google-api-python-client==2.187.0' 'google-auth==2.43.0'
      - name: Send the bundle to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.CRANAMP_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_ROLLOUT: ${{ inputs.play_rollout }}
        run: python3 scripts/distribution/play-upload.py play-upload/app-release.aab
  msstore-upload:
    if: inputs.msstore_upload_run != ''
    runs-on: ubuntu-latest
    concurrency:
      group: msstore-upload
    steps:
      - name: Check source package job
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.msstore_upload_run }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN/jobs" --paginate --jq '.jobs[] | select(.name == "Microsoft Store MSIX") | .conclusion' | grep -qx success
      - uses: actions/download-artifact@v8
        with:
          name: microsoft-store-msix
          path: msstore-upload
          run-id: ${{ inputs.msstore_upload_run }}
          github-token: ${{ github.token }}
      - name: Install the Microsoft Store CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download v0.4.3 -R microsoft/msstore-cli -p 'MSStoreCLI-linux-x64.tar.gz*'
          expected=$(iconv -f UTF-16 -t UTF-8 MSStoreCLI-linux-x64.tar.gz.sha256.txt 2>/dev/null || cat MSStoreCLI-linux-x64.tar.gz.sha256.txt)
          actual=$(sha256sum MSStoreCLI-linux-x64.tar.gz | cut -d' ' -f1)
          echo "$expected" | tr -d '\r' | grep -qi "$actual"
          mkdir msstore && tar -xzf MSStoreCLI-linux-x64.tar.gz -C msstore
          echo "$RUNNER_TEMP/msstore" >> "$GITHUB_PATH"
      - name: Submit the package to the Microsoft Store
        env:
          MS_TENANT_ID: ${{ secrets.CRANAMP_MS_STORE_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.CRANAMP_MS_STORE_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.CRANAMP_MS_STORE_CLIENT_SECRET }}
          MS_SELLER_ID: ${{ secrets.CRANAMP_MS_STORE_SELLER_ID }}
          MS_PRODUCT_ID: ${{ vars.CRANAMP_MS_STORE_PRODUCT_ID || '9N0XTC9PGM8X' }}
        run: |
          set -euo pipefail
          package=$(find msstore-upload -maxdepth 1 -name '*.msix' -type f)
          test -f "$package"
          msstore reconfigure --tenantId "$MS_TENANT_ID" --clientId "$MS_CLIENT_ID" --clientSecret "$MS_CLIENT_SECRET" --sellerId "$MS_SELLER_ID"
          msstore publish "$(dirname "$package")" --inputDirectory "$(dirname "$package")" --appId "$MS_PRODUCT_ID" --uploadTimeout 900
  aur-publish:
    if: inputs.aur_publish_run != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: aur-publish
    steps:
      - uses: actions/checkout@v7
      - name: Check source package job
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.aur_publish_run }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN/jobs" --paginate --jq '.jobs[] | select(.name == "Linux DEB, RPM and AUR source package") | .conclusion' | grep -qx success
      - uses: actions/download-artifact@v8
        with:
          name: linux-repository-packages
          path: linux
          run-id: ${{ inputs.aur_publish_run }}
          github-token: ${{ github.token }}
      - name: Attach the archives the recipes download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/distribution/version.py)
          for recipe in linux/aur/PKGBUILD linux/aur-bin/PKGBUILD; do grep -qx "pkgver=$version" "$recipe"; done
          gh release upload "v$version" "linux/cranamp-$version-source.tar.gz" "linux/cranamp-$version-linux-x86_64-store.tar.gz" --clobber
      - name: Push both AUR recipes
        env:
          AUR_SSH_KEY: ${{ secrets.CRANAMP_AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/distribution/version.py)
          key="$RUNNER_TEMP/aur_key"
          (umask 077; printf '%s\n' "$AUR_SSH_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$RUNNER_TEMP/aur_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/aur_hosts"
          git config --global user.name 'Dmitry Samoylenko'
          git config --global user.email 'samoylenkodmitry@gmail.com'
          for pair in cranamp:aur cranamp-bin:aur-bin; do
            repo=${pair%%:*}; dir=${pair##*:}
            git clone "ssh://aur@aur.archlinux.org/$repo.git" "$RUNNER_TEMP/$repo"
            cp "linux/$dir/PKGBUILD" "linux/$dir/.SRCINFO" "$RUNNER_TEMP/$repo/"
            git -C "$RUNNER_TEMP/$repo" add PKGBUILD .SRCINFO
            if git -C "$RUNNER_TEMP/$repo" diff --cached --quiet; then echo "$repo is current"; continue; fi
            git -C "$RUNNER_TEMP/$repo" commit -m "Update to Cranamp $version"
            git -C "$RUNNER_TEMP/$repo" push origin HEAD:master
          done
  snap-publish:
    if: inputs.snap_publish_run != ''
    runs-on: ubuntu-latest
    concurrency:
      group: snap-publish
    steps:
      - name: Check source package job
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.snap_publish_run }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN/jobs" --paginate --jq '.jobs[] | select(.name == "Snap") | .conclusion' | grep -qx success
      - uses: actions/download-artifact@v8
        with:
          name: snap-store
          path: snap-publish
          run-id: ${{ inputs.snap_publish_run }}
          github-token: ${{ github.token }}
      - name: Find the snap
        id: snap
        run: echo "file=$(find snap-publish -name '*.snap' -type f)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.CRANAMP_SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.file }}
          release: stable
  apple-status:
    if: inputs.apple_status_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyJWT[crypto]==2.10.1'
      - name: Read App Store Connect status
        env:
          ASC_P8_BASE64: ${{ secrets.CRANAMP_ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.CRANAMP_ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CRANAMP_ASC_API_ISSUER_ID }}
        run: python3 scripts/distribution/apple-status.py
  android:
    if: inputs.apple_status_only != true && inputs.apple_upload_run == '' && inputs.apple_listing_platform == '' && inputs.play_upload_run == '' && inputs.msstore_upload_run == '' && inputs.aur_publish_run == '' && inputs.snap_publish_run == ''
    name: Google Play AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - uses: ./.github/actions/store-notices
        with:
          target: aarch64-linux-android
          features: android,renderer-wgpu,store
      - name: Bundle legal notices
        run: |
          mkdir -p platform/android/app/src/main/assets/legal
          cp LICENSE docs/third-party/LiberationSans-OFL-1.1.txt target/distribution/THIRD-PARTY.html platform/android/app/src/main/assets/legal/
      - name: Prepare upload signing
        if: inputs.signed == true
        env:
          KEYSTORE_BASE64: ${{ secrets.CRANAMP_PLAY_UPLOAD_KEYSTORE_BASE64 || secrets.CRANAMP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Play upload or existing Cranamp release keystore'; exit 1; }
          (umask 077; printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play-upload.jks")
          echo "CRANAMP_RELEASE_KEYSTORE=$RUNNER_TEMP/play-upload.jks" >> "$GITHUB_ENV"
      - name: Build store bundle
        env:
          CRANAMP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CRANAMP_PLAY_UPLOAD_KEYSTORE_PASSWORD || secrets.CRANAMP_RELEASE_KEYSTORE_PASSWORD }}
          CRANAMP_RELEASE_KEY_ALIAS: ${{ secrets.CRANAMP_PLAY_UPLOAD_KEY_ALIAS || secrets.CRANAMP_RELEASE_KEY_ALIAS }}
          CRANAMP_RELEASE_KEY_PASSWORD: ${{ secrets.CRANAMP_PLAY_UPLOAD_KEY_PASSWORD || secrets.CRANAMP_RELEASE_KEY_PASSWORD }}
        run: |
          version=$(python3 scripts/distribution/version.py)
          export GITHUB_REF_NAME="v$version"
          cd platform/android
          ./gradlew --no-daemon -PcranampStore=true :app:bundleRelease
      - name: Verify store manifest and stage AAB
        run: |
          python3 test/distribution/check_android_manifest.py platform/android/app/build/intermediates/merged_manifest/release/cranposeReleaseManifestCheck/AndroidManifest.xml
          mkdir -p store-artifacts
          cp platform/android/app/build/outputs/bundle/release/*.aab store-artifacts/
          cp target/distribution/THIRD-PARTY.html store-artifacts/
          if [ "$CRANAMP_STORE_SIGNED" = true ]; then
            jarsigner -verify -verbose -certs store-artifacts/*.aab > "$RUNNER_TEMP/aab-signature.txt"
            grep -q 'jar verified.' "$RUNNER_TEMP/aab-signature.txt"
            if grep -q 'jar is unsigned' "$RUNNER_TEMP/aab-signature.txt"; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: google-play-bundle
          path: store-artifacts/
          if-no-files-found: error
      - name: Delete upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-upload.jks"

  apple:
    if: inputs.apple_status_only != true && inputs.apple_upload_run == '' && inputs.apple_listing_platform == '' && inputs.play_upload_run == '' && inputs.msstore_upload_run == '' && inputs.aur_publish_run == '' && inputs.snap_publish_run == ''
    name: Apple ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            targets: aarch64-apple-ios
            notice_target: aarch64-apple-ios
            features: ios,store
          - platform: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            notice_target: aarch64-apple-darwin
            features: desktop,renderer-wgpu,store
    env:
      CRANAMP_APPLE_BUNDLE_ID: ${{ vars.CRANAMP_APPLE_BUNDLE_ID || 'io.cranamp.app' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/store-notices
        with:
          target: ${{ matrix.notice_target }}
          features: ${{ matrix.features }}
      - name: Install distribution credentials
        if: inputs.signed == true
        env:
          P12_BASE64: ${{ secrets.CRANAMP_APPLE_STORE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CRANAMP_APPLE_STORE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ matrix.platform == 'ios' && secrets.CRANAMP_IOS_STORE_PROFILE_BASE64 || secrets.CRANAMP_MAC_STORE_PROFILE_BASE64 }}
          CRANAMP_APPLE_SIGN_IDENTITY: ${{ vars.CRANAMP_APPLE_STORE_SIGN_IDENTITY }}
          CRANAMP_MAC_INSTALLER_IDENTITY: ${{ vars.CRANAMP_MAC_INSTALLER_IDENTITY }}
        run: bash scripts/distribution/apple-credentials.sh
      - name: Build store archive and distribution package
        env:
          APPLE_PLATFORM: ${{ matrix.platform }}
          CRANAMP_APPLE_SIGN_IDENTITY: ${{ vars.CRANAMP_APPLE_STORE_SIGN_IDENTITY }}
          CRANAMP_MAC_INSTALLER_IDENTITY: ${{ vars.CRANAMP_MAC_INSTALLER_IDENTITY }}
        run: python3 scripts/distribution/apple.py "$APPLE_PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: apple-${{ matrix.platform }}-store
          path: store-artifacts/
          if-no-files-found: error
      - name: Remove distribution credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/cranamp-store.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/store.p12" "$RUNNER_TEMP/store-profile.mobileprovision"
          if [ -n "${CRANAMP_INSTALLED_PROFILE:-}" ]; then rm -f "$CRANAMP_INSTALLED_PROFILE"; fi

  windows:
    if: inputs.apple_status_only != true && inputs.apple_upload_run == '' && inputs.apple_listing_platform == '' && inputs.play_upload_run == '' && inputs.msstore_upload_run == '' && inputs.aur_publish_run == '' && inputs.snap_publish_run == ''
    name: Microsoft Store MSIX
    runs-on: windows-latest
    env:
      CRANAMP_MSIX_IDENTITY: ${{ vars.CRANAMP_MSIX_IDENTITY }}
      CRANAMP_MSIX_PUBLISHER: ${{ vars.CRANAMP_MSIX_PUBLISHER }}
      CRANAMP_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.CRANAMP_MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/store-notices
        with:
          target: x86_64-pc-windows-msvc
          features: desktop,renderer-wgpu,store,logging
      - name: Build player
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --features store,logging --target x86_64-pc-windows-msvc
      - name: Build MSIX
        shell: pwsh
        run: ./scripts/distribution/windows.ps1
      - name: Capture Windows player and Skin Studio
        shell: pwsh
        env:
          RUST_LOG: warn
        run: ./test/distribution/windows-store-screenshots.ps1 -Executable target/x86_64-pc-windows-msvc/release/cranamp.exe -OutputDirectory store-artifacts/screenshots
      - name: Capture the running Windows player
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CRANAMP_REVIEW_CAPTURE: store-artifacts/screenshots/00-playback.png
          CRANAMP_REVIEW_CAPTURE_ONCE: '1'
          CRANAMP_REVIEW_CAPTURE_RGB: '1'
        run: |
          cargo build --locked --release --features studio-review --bin cranamp-studio-review --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/x86_64-pc-windows-msvc/release/cranamp-studio-review.exe --player 1440 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: microsoft-store-msix
          path: store-artifacts/
          if-no-files-found: warn

  snap:
    if: inputs.apple_status_only != true && inputs.apple_upload_run == '' && inputs.apple_listing_platform == '' && inputs.play_upload_run == '' && inputs.msstore_upload_run == '' && inputs.aur_publish_run == '' && inputs.snap_publish_run == ''
    name: Snap
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-repository-packages
          path: linux
      - name: Stage the snap project
        run: |
          set -euo pipefail
          version=$(python3 scripts/distribution/version.py)
          mkdir snap-build
          cp platform/snap/snapcraft.yaml snap-build/
          cp "linux/cranamp-$version-linux-x86_64-store.tar.gz" snap-build/cranamp-linux-x86_64-store.tar.gz
          tar -xzf snap-build/cranamp-linux-x86_64-store.tar.gz -C "$RUNNER_TEMP" usr/share/icons/hicolor/512x512/apps/io.cranamp.app.png
          cp "$RUNNER_TEMP/usr/share/icons/hicolor/512x512/apps/io.cranamp.app.png" snap-build/
          echo "$version" > snap-build/version.txt
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: snap-build
      - uses: actions/upload-artifact@v7
        with:
          name: snap-store
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
  linux:
    if: inputs.apple_status_only != true && inputs.apple_upload_run == '' && inputs.apple_listing_platform == '' && inputs.play_upload_run == '' && inputs.msstore_upload_run == '' && inputs.aur_publish_run == '' && inputs.snap_publish_run == ''
    name: Linux DEB, RPM and AUR source package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config dpkg-dev rpm desktop-file-utils
      - uses: ./.github/actions/store-notices
        with:
          target: x86_64-unknown-linux-gnu
          features: desktop,renderer-wgpu,store
      - name: Build packages
        run: |
          desktop-file-validate platform/linux/io.cranamp.app.desktop
          bash scripts/distribution/linux.sh
          bash scripts/distribution/aur.sh
      - name: Generate AUR metadata
        run: |
          docker run --rm -v "$PWD/store-artifacts:/packages" archlinux:base-devel bash -c '
            useradd -m builder
            chown -R builder:builder /packages/aur /packages/aur-bin
            su builder -c "cd /packages/aur && makepkg --printsrcinfo > .SRCINFO"
            su builder -c "cd /packages/aur-bin && makepkg --printsrcinfo > .SRCINFO"
          '
      - uses: actions/upload-artifact@v7
        with:
          name: linux-repository-packages
          path: store-artifacts/
          include-hidden-files: true
          if-no-files-found: error
